stages:
  - build
  - fuzzer
  - coverage
  - test
  - sbom

variables:
  PNPM_CACHE_DIR: ".pnpm-store"

default:
  tags:
    - flarenetwork
  artifacts:
    expire_in: 3 days

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_TAG

include:
  - component: gitlab.com/flarenetwork/ci-components-private/lgtm@2
  - component: gitlab.com/flarenetwork/ci-components-private/dependency-track@2
  - component: gitlab.com/flarenetwork/ci-components-private/lint-shell@2
  - component: gitlab.com/flarenetwork/ci-components-private/lint-dockerfile@2
  - template: Jobs/SAST.latest.gitlab-ci.yml
  - template: Jobs/Secret-Detection.latest.gitlab-ci.yml

sast:
  needs: []

.pnpm-cache:
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - $PNPM_CACHE_DIR
      - node_modules

.test:
  stage: test
  image: node:24
  extends: .pnpm-cache
  tags:
    - flarenetwork-md
  variables:
    DEPLOYER_PRIVATE_KEY: "0xc5e8f61d1ab959b397eecc0a37a6517b8e67a0e7cf1f4bce5591f3ed80199122"
    GENESIS_GOVERNANCE_PRIVATE_KEY: "0x50777f5a3ce16445e63411bf1e865a2a11d5ca3c4cbc1de00808a52180bd8d3c"
    GOVERNANCE_PRIVATE_KEY: "0xd49743deccbccc5dc7baa8e69e5be03298da8688a15dd202e20f15d5e0e9a9fb"
    GOVERNANCE_PUBLIC_KEY: "0xeAD9C93b79Ae7C1591b1FB5323BD777E86e150d4"
    GOVERNANCE_EXECUTOR_PUBLIC_KEY: "0xE5904695748fe4A84b40b3fc79De2277660BD1D3"
    NODE_OPTIONS: "--max_old_space_size=8192"
  needs:
    - job: build-smart-contracts
      artifacts: true
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile

build-smart-contracts:
  stage: build
  extends: .pnpm-cache
  needs: []
  image: node:24
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile
  script:
    - pnpm compile
  artifacts:
    paths:
      - typechain
      - typechain-truffle
      - typechain-web3
    expire_in: 1 week

# todo: migrate to pnpm
test-scdev-daemon:
  extends: .test
  image: timivesel/flare-scdev:1.3
  before_script:
    - curl -sS https://dl.yarnpkg.com/debian/pubkey.gpg | sudo apt-key add -
    - apt-get update
    - apt-get install -y git
  script:
    - yarn hardhat test --network scdev test/scdev/system/FlareDaemon.ts

test-unit:
  extends: .test
  script:
    - pnpm hardhat test --network hardhat ${TEST_ARG}
  parallel:
    matrix:
      - TEST_PATH:
          - ./test/unit/addressUpdater
          - ./test/unit/claiming
          - ./test/unit/genesis
          - ./test/unit/adversary
          - ./test/unit/assetRegistry
          - ./test/unit/Xasset
          - ./test/unit/inflation
          - ./test/unit/token
          - ./test/unit/utils
          - ./test/unit/staking
      - TEST_ARG:
          - test/unit/gasReport/GasReport.ts

test-unit-heavy:
  extends:
    - test-unit
  tags:
    - flarenetwork-md
  variables:
    NODE_OPTIONS: "--max_old_space_size=6144"
  retry:
    when: script_failure
    max: 2
  parallel:
    matrix:
      - TEST_PATH:
          - ./test/unit/ftso
          - ./test/unit/tokenPools
          - ./test/unit/governance

test-linter:
  extends: .test
  script:
    - pnpm lint

test-contract-integration:
  extends: .test
  script:
    - pnpm test_integration_hh

test-fuzzing-token:
  extends: .test
  script:
    - pnpm test_fuzzing_token

test-fuzzing-token-cleanup-block:
  extends: .test
  variables:
    CLEANUP_BLOCK: 1500
    SET_CLEANUP_BLOCK_AT: 2100
  script:
    - pnpm test_fuzzing_token

test-fuzzing-token-repl-vpcontract:
  extends: .test
  variables:
    REPLACE_VPCONTRACT_AT: 1100
    SPLIT_VPCONTRACTS_BLOCKS: 500
  script:
    - pnpm test_fuzzing_token

test-contract-performance:
  extends: .test
  script:
    - pnpm test_performance_hh

test-contract-end-to-end:
  extends: .test
  script:
    - pnpm test_endtoend_hardhat

test-contract-end-to-end_2:
  extends:
    - .test
  tags:
    - flarenetwork-lg
  script:
    - pnpm test_claim_topup_hardhat_fast

test-slither-check:
  extends: .test
  before_script:
    - apt update
    - apt install -y python3-pip
    - pip3 install --break-system-packages slither-analyzer
    - corepack enable
    - pnpm install --frozen-lockfile
  script:
    - pnpm slither
  # artifacts:
  #     when: always
  #     name: "$CI_JOB_NAME"
  #     paths:
  #         - slither_badge.json
  #     expire_in: 1 week

test-onlyDetector:
  extends: .test
  script:
    - sh scripts/test-only.sh

coverage:schedule:
  extends: .test
  stage: coverage
  retry: 2
  script:
    - pnpm cov
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_NAME == "coverage"'
    - when: never

e2e-fuzzer:schedule:
  extends: .test
  stage: fuzzer
  timeout: 4 hours
  variables:
    NODE_OPTIONS: "--max_old_space_size=6144"
    LOOPS: 5000
    N_PROVIDERS: 20
    N_DELEGATORS: 10
    BIG_JUMP_EVERY: 50
    BIG_JUMP_SECONDS: 432000
    MINING_BATCH_SIZE: 20
    CHAIN_CONFIG: '{"defaultVoterWhitelistSize":25,"priceEpochDurationSeconds":180,"revealEpochDurationSeconds":90,"rewardEpochDurationSeconds":604800,"ftsoRewardExpiryOffsetDays":30}'
  script:
    - pnpm test_fuzzing_endtoend
  artifacts:
    paths:
      - test_logs/end-to-end-fuzzing.log
    #   - e2e_fuzzer_badge.json
    name: end-to-end-fuzzing
    when: always
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_NAME == "fuzzer"'
    - when: never
